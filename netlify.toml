[build]
  publish = "public"
  command = "node tools/build-data.js"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# No long cache on /assets/*: Netlify's default (re-check on every visit, served from its CDN)
# plus the ?v= version stamps that tools/build-data.js adds mean new deploys show immediately.

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
